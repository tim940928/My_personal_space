<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI數值方法:個人作業</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
  color:#fff;background:#fafafc;line-height:1.7;overflow-x:hidden
}

body:before{
  content:"";position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(circle at 50% 50%,rgba(246, 246, 248, 0.25),transparent 28%),
    radial-gradient(circle at 80% 80%,rgba(21, 105, 189, 0.45),transparent 30%),
    radial-gradient(circle at 20% 20%,rgba(21, 105, 189, 0.45),transparent 30%),
     linear-gradient(180deg,#030513 0%,#080d24 50%,#030512 100%);
}

.stars,.stars:before,.stars:after{
  position:fixed;inset:0;content:"";z-index:-2;
  background-image:
  url(images/M41.jpg);
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center;
  opacity: 0.45;
}

a{text-decoration:none;color:lightgray}

nav{
  position:fixed;top:0;left:0;right:0;z-index:10;
  padding:16px 6%;display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(180deg,rgba(3,5,19,.9),transparent);backdrop-filter:blur(5px)
}

.logo{letter-spacing:1px;margin-right:10px;
    transform: translateX(-50px);
}

.logo a{color: #fff;
    font-weight:1000;
}

nav a{font-size:.9rem;opacity:.85;margin-left:18px}
.hero{min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:90px 24px 50px}
.hero-inner{max-width:800px;
    transform: translateY(-150px);}

.badge{
  display:inline-block;padding:6px 14px;border:1px solid rgba(255,255,255,.2);
  border-radius:999px;background:rgba(255,255,255,.06);font-size:.85rem;margin-bottom:24px
}
h1{font-size:clamp(3rem,8.5vw,5.5rem);line-height:1.02;letter-spacing:-.06em;margin-bottom:24px}

.hero p{font-size:clamp(1rem,2.5vw,1.1rem);opacity:.78;max-width:600px;margin:auto}

.fuck p{font-size:1rem;
    transform: translateY(-267px);
    text-align: center;
    color: #888990;
}

.btn{display:inline-block;margin-top:34px;padding:13px 24px;border-radius:999px;
    background:#fff;color:#070916;font-weight:800;transition:.25s
}

.btn:hover{transform:translateY(-3px);box-shadow:0 12px 35px rgba(255,255,255,.15)}

.scroll{margin-top:70px;font-size:.8rem;opacity:.45}
section{padding:90px 6%;max-width:1100px;margin:auto}

.kicker{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;opacity:.5;margin-bottom:10px}

h2{font-size:clamp(1.3rem,5vw,3rem);
    line-height:1.15;
    margin-bottom:28px
}

h3{font-size:clamp(1rem,1.67vw,2rem);
    line-height:1.15;
    margin-bottom:28px

</style>
<body>
<section id="page">
<nav>
  <div class="logo">
    <a><h2>學號:413210328</a>
    <br><h3>姓名:許耕綸 系級:物理系三
  </div>
</nav>
</section>
  </body>
</html>
